name: repro

on:
  push:
  workflow_dispatch:

jobs:
  repro:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        micronaut: ["5.2.22", "4.10.33"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - run: ./repro.sh ${{ matrix.micronaut }}
